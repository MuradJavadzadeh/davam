<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15141C">
<script>(function(){var t;try{t=localStorage.getItem('ritm_tema')}catch(e){}if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-tema',t)})()</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Davam</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="description" content="Davam: vərdiş, hobbi və seriya izləyicisi. Hər gün bir az.">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;--fill:var(--a)}
:root{
/* Tünd tema (əsas). Açıq tema dəyərləri faylın sonunda: :root[data-tema=light]
   Rəng cütləri: *1 = doldurma rəngi, *2 = mətn/ikon üçün vurğu (tünddə açıq, açıqda tünd) */
--ff:'Plus Jakarta Sans',system-ui,sans-serif;
--bg:#15141C;--tx:#F3F1EC;--mut:#A3A1B0;--ln:#2B2A35;--ln2:#3A3946;--side:#1E1D27;
--card:#1E1D27;--sheet:#1E1D27;--sf:#26252F;--sf2:#2E2D38;--fld:#15141C;--trk:#2B2A35;
--on:#15141C;--fsh:#15141C 0%;--bdp:rgba(5,5,10,.62);--ink:#14122e;
--no:#EF6B73;--no-t:#F59AA0;--no-on:#1A0B0D;--no-bg:rgba(239,107,115,.12);--no-ln:rgba(239,107,115,.45);
--rk:#F2946E;--rk-bg:#3A2620;--rk-d:#5A3424;--rk-c:#FFD9C8;
--navon:#282A44;--glow:0;--shd:none;--bgfx:none;--ckb:#6F6D7C;--pop:0 14px 36px -12px rgba(0,0,0,.65);
/* *3 = yumşaq fon (ikon plitəsi, düymə fonu) */
--m1:#8D97F0;--m2:#A3ABF5;--m3:#282A44;--h1:#B79CF2;--h2:#C9B6F6;--h3:#2E2742;--g1:#8D97F0;--g2:#A3ABF5;--g3:#282A44;--b1:#E7A464;--b2:#EDB57E;--b3:#33281F;--p1:#8D97F0;--p2:#A3ABF5;--p3:#282A44;
/* Seriya pillələri */
--t0:#5C5A6A;--t1:#7E7B90;--core:#DCE0FD;--disc:#2E3156;--gold:#E8B84A;--gold-bg:#3D3320;--gold-core:#FFF1C9;--gold-t:#E8B84A;
color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:400 15px/1.45 var(--ff);min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--a,var(--m2));outline-offset:2px}
.c,nav,.sh{background:var(--card);border:1px solid transparent;box-shadow:var(--shd)}
nav{background:var(--side)}
main{padding:26px 18px 190px;max-width:720px;margin:auto}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.lead{color:var(--mut);margin:4px 0 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln);z-index:5}
nav .br{display:none}
nav button{flex:1;background:none;border:0;color:var(--mut);font-weight:600;font-size:11px;line-height:1.15;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:12px}
nav button.on{color:var(--b)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;gap:14px}
.c{--a:var(--m1);--b:var(--m2);--tn:var(--m3);border-radius:20px;padding:18px;position:relative;overflow:hidden;cursor:pointer}
.c>*{position:relative}
.hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
h4{font-size:16px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:13px;line-height:1.45}
.sk{margin:14px 0 12px;display:flex;align-items:baseline;gap:8px}
.sk b{font-size:42px;line-height:1;font-weight:700;letter-spacing:-.03em;color:var(--tx);font-variant-numeric:tabular-nums}
.sk span{color:var(--mut);font-weight:600;font-size:13px}
/* Gün vəziyyətləri (təqvim, kart nöqtələri, "Bu həftə"):
   ok = etdim (dolu rəng), part = qismən etdim (içi boş incə qırmızı), no = etmədim (dolu qırmızı),
   skip = keçdim (qırıq xətt), pg = bu gün davam edir (rəngli halqa), off = gələcək və ya başlamazdan əvvəl */
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cg i{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font:600 12px var(--ff);font-style:normal;background:var(--sf);color:var(--mut)}
.cg i.ok{background:var(--fill);color:var(--on)}
.cg i.part{background:none;box-shadow:inset 0 0 0 1.5px var(--no);color:var(--no-t)}
.cg i.no{background:var(--no);color:var(--no-on)}
.cg i.pg{background:none;box-shadow:inset 0 0 0 1.5px var(--a);color:var(--tx)}
.cg i.off{opacity:.35;background:none}
.cg i.td{outline:2px solid var(--a);outline-offset:1px}
.dots{display:flex;justify-content:space-between;gap:4px}.dots i{width:34px;height:34px;aspect-ratio:auto;flex:none;border-radius:50%;font-size:11px}
.dots i.off{opacity:1;background:none;box-shadow:inset 0 0 0 1px var(--ln);color:color-mix(in srgb,var(--mut) 60%,transparent)}
.dots i.td{outline-offset:2px}
.row{display:flex;align-items:center;gap:12px;margin-top:14px;cursor:default}
.ctl{display:grid;gap:10px;flex:1}
.f{display:flex;align-items:center;gap:10px}
.f>span{color:var(--mut);font-size:13px}
.f b{min-width:46px;text-align:center;font-size:18px}
.ck{width:52px;height:52px;padding:0;border-radius:50%;border:1.5px solid var(--ln);background:var(--sf);display:grid;place-items:center;flex:none;margin-left:auto;transition:background .2s}
.ck svg{width:24px;height:24px;fill:none;stroke:var(--tx);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.25}
.ck.on{background:var(--fill);border-color:transparent}
.ck.on svg{opacity:1;stroke:var(--on)}
.pop{animation:pop .4s}
.mn{width:84px;height:44px;background:var(--fld);border:1.5px solid var(--ln);border-radius:10px;text-align:center;font-weight:700;font-size:16px}
.gh{height:44px;padding:0 18px;border-radius:10px;border:1.5px solid var(--ln);background:var(--sf);font-weight:600}
.rb{width:42px;height:42px;border-radius:50%;border:0;background:var(--sf);color:var(--tx);font-size:20px;display:grid;place-items:center;padding:0}
.wn{color:var(--no-t);font-size:13px;font-weight:600}
.em{text-align:center;color:var(--mut);padding:50px 10px;display:grid;gap:14px;justify-items:center}
.bd{position:fixed;inset:0;background:var(--bdp);z-index:20}
.sh{--a:var(--m1);--b:var(--m2);position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:auto;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));z-index:21;background:var(--sheet)}
.sh.a{animation:up .3s}
.sh h3{font-size:20px;font-weight:700;margin-bottom:14px;letter-spacing:-.02em}
.sh .hd h3{margin-bottom:2px}
.x{background:none;border:0;color:var(--mut);font-size:16px;padding:6px;display:inline-grid;place-items:center;border-radius:10px}.x svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.seg{display:flex;gap:4px;background:var(--fld);padding:4px;border-radius:10px}
.seg button{flex:1;height:40px;border:0;border-radius:7px;background:none;color:var(--mut);font-weight:600;font-size:13px}
.seg button.on,.gh.on,.dn button.on,.cb.on{background:var(--fill);color:var(--on);border-color:transparent}
.in{width:100%;height:50px;margin:14px 0 0;background:var(--fld);border:1.5px solid var(--ln);border-radius:10px;padding:0 16px;font-weight:600}
.in.w{border-color:var(--no)}
.lb{color:var(--mut);font-weight:600;font-size:13px;margin:18px 0 8px}
.fr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fr .gh{height:40px;padding:0 14px;white-space:nowrap}
.dn{display:flex;gap:5px;flex:1;justify-content:flex-end}
.dn button{width:34px;height:34px;padding:0;border-radius:50%;border:1.5px solid var(--ln);background:var(--sf);font-weight:600;font-size:13px}
.tg{display:flex;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--ln);border-radius:11px;padding:9px 12px;margin-top:10px;min-height:54px}
.tg>span{flex:1;font-weight:600;font-size:14px}
.cb{width:26px;height:26px;padding:0;border-radius:7px;border:2px solid var(--ckb);background:none;display:grid;place-items:center}
.cb svg{width:16px;height:16px;fill:none;stroke:var(--on);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.cb.on svg{opacity:1}
.stp{display:flex;align-items:center;gap:4px;background:var(--fld);border-radius:9px;padding:3px}
.stp button{width:34px;height:34px;border-radius:7px;border:0;background:var(--sf2);font-size:18px;padding:0;display:grid;place-items:center}.stp button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.stp b{min-width:58px;text-align:center;font-size:13px}
.hint{color:var(--mut);font-size:13px;margin-top:10px}
.go{width:100%;height:54px;margin-top:20px;border:0;border-radius:14px;background:var(--fill);font-weight:700;font-size:15px;color:var(--on)}
.go.s{animation:sh .3s}
.nv{display:flex;align-items:center;justify-content:space-between;margin:16px 0 12px}
.nv b{font-weight:600}
.yr{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.yr b{font-size:12px;color:var(--mut);font-weight:600}
.yr .cg{gap:2px;margin-top:5px}.yr .cg i{border-radius:3px;font-size:0}
.lg{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;color:var(--mut);font-size:12px}
.lg span:before{content:"";display:inline-block;vertical-align:-1px;width:11px;height:11px;border-radius:4px;margin-right:6px;background:var(--sf2)}
.lg .ok:before{background:var(--fill)}
.lg .part:before{background:none;box-shadow:inset 0 0 0 1.5px var(--no)}
.lg .no:before{background:var(--no)}
.dl{width:100%;height:46px;margin-top:20px;border-radius:10px;border:1px solid var(--no-ln);background:var(--no-bg);color:var(--no-t);font-weight:600}
.fade .c{animation:fu .4s both}
.fade .grid>:nth-child(2){animation-delay:.05s}.fade .grid>:nth-child(n+3){animation-delay:.1s}
.ring{animation:rg .9s cubic-bezier(.2,.8,.2,1)}
@keyframes fu{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{40%{transform:scale(1.22)}}
@keyframes up{from{opacity:0;translate:0 40px}}
@keyframes rg{from{stroke-dasharray:0 227}}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:20px}
.top>div:first-child{min-width:0}
.ta{display:flex;gap:8px;flex:none}
.top .rb{width:44px;height:44px;background:var(--card);color:var(--mut)}
.hdt{font-size:13px;font-weight:600;color:var(--mut);margin-bottom:4px}
.adb{height:44px;min-width:44px;border:0;border-radius:22px;background:var(--m1);color:var(--on);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0;font-weight:700;font-size:14px}
.adb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.adb span{display:none}
.rb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rb.on{--a:var(--m1);--b:var(--m2);background:var(--fill);color:var(--on);border-color:transparent}
.tt{display:flex;gap:12px;align-items:center}
.cn{flex:1;min-width:0}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--tn,var(--sf))}
.ic svg{width:20px;height:20px;fill:none;stroke:var(--a);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wkc{cursor:default;padding:16px 18px}
.bn{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:14px;border-radius:14px}
.cg i.skip{background:none;border:1.5px dashed var(--ckb)}
.cg i.sel{outline:2px solid var(--tx);outline-offset:1px}
.cg i[data-a]{cursor:pointer}
.lg .skip:before{background:none;border:1.5px dashed var(--mut)}
.de{margin-top:16px;padding:14px;border-radius:12px;background:color-mix(in srgb,var(--a) 9%,transparent);border:1px solid color-mix(in srgb,var(--a) 24%,var(--ln))}
.de .hd{align-items:center;margin-bottom:6px}.de .gh{height:38px;padding:0 14px}

/* Ana səhifə: gün halqası */
.hero{display:flex;align-items:center;cursor:default;padding:18px;gap:18px}
.rg{position:relative;width:84px;height:84px;flex:none}
.rg svg{width:84px;height:84px;display:block}
.hi{flex:1;min-width:0;display:grid;gap:6px}
.hgo{cursor:pointer;border-radius:6px}.hgo:focus-visible{outline:2px solid var(--m1);outline-offset:2px}
@media(hover:hover){.hgo:hover{color:var(--tx)}}
.hl{font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.hln{font-size:14px;color:var(--mut)}
.hrk{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--rk)}
/* Ana səhifə: bölmə başlığı və siyahı */
.sth{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:28px 0 10px}
.sth h2{font-size:16px;font-weight:700;letter-spacing:-.01em}
.sth span{font-size:13px;font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums}
.hl2{padding:0 16px;cursor:default;overflow:visible}
.hr{position:relative;display:flex;align-items:center;gap:10px;padding:14px 0;cursor:pointer;min-height:72px}
.hr+.hr{border-top:1px solid var(--ln)}
.hr .cn{display:grid;gap:2px}
.nm{font-size:16px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hs{display:flex;align-items:center;gap:4px;min-width:0;font-size:13px;color:var(--mut);white-space:nowrap}
.hs .q{overflow:hidden;text-overflow:ellipsis;min-width:0}
.hs .wn{font-size:13px}
.sn{display:inline-flex;align-items:center;gap:3px;flex:none;font-weight:700;color:var(--tx);font-variant-numeric:tabular-nums}
.sn.z3,.sn.z4,.sn.z5,.sn.z6,.sn.z7{color:var(--m2)}.sn.z8{color:var(--gold-t)}
.sn.rk{color:var(--rk);background:var(--rk-bg);padding:1px 7px 1px 4px;border-radius:999px}
.sn.rk .tier{width:16px;height:16px}
.ra{display:flex;align-items:center;gap:6px;flex:none}
.rmw{position:relative}
.rmb{width:28px;height:44px;border:0;padding:0;border-radius:10px;background:none;color:var(--ckb);display:grid;place-items:center}
.rmb svg{width:20px;height:20px;fill:currentColor}.rmb.on{background:var(--sf);color:var(--tx)}
.rmn{right:-6px;top:calc(100% + 2px);min-width:230px}
.rmn button{display:grid;gap:1px}
.rmn small{font-size:12px;color:var(--mut);font-weight:500}
.rmn .red span{color:var(--no-t);font-weight:600}
.hk,.hx{width:44px;height:44px;border-radius:50%;border:2px solid var(--m1);background:none;display:grid;place-items:center;padding:0;flex:none}
.hk svg,.hx svg{width:20px;height:20px;fill:none;stroke:var(--on);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.hk.on{background:var(--m1)}.hk.on svg{opacity:1}
.hx{border:0;background:var(--no-bg)}.hx svg{stroke:var(--no-t);opacity:1;width:18px;height:18px}
.hp{height:44px;padding:0 14px;border-radius:22px;border:0;background:var(--sf);color:var(--tx);font-size:14px;font-weight:700;white-space:nowrap;flex:none}
.hp.ac{background:var(--m3);color:var(--m2)}
.hp.ac.on{background:var(--m1);color:var(--on)}
.hr .ck{width:36px;height:36px;margin:0}.hr .ck svg{width:18px;height:18px}
.hr.osl .nm{color:var(--m2)}
.ghost.hr{background:var(--card);border-radius:14px;padding:14px 12px}
/* Seriya pilləsi ikonu */
.tier{width:18px;height:18px;flex:none;display:block;--zf:var(--m1);--zc:var(--core);--zd:var(--disc);--zs:var(--m2)}
.tier .zf{fill:var(--zf)}.tier .zc{fill:var(--zc)}.tier .zd{fill:var(--zd)}.tier .zs{fill:var(--zs)}.tier .zr{fill:none;stroke:var(--zs);stroke-width:1.2}
.tier.z1{--zf:var(--t0)}.tier.z2{--zf:var(--t1)}.tier.z5,.tier.z6,.tier.z7{--zf:var(--m2)}
.tier.z8{--zf:var(--gold);--zc:var(--gold-core);--zd:var(--gold-bg);--zs:var(--gold)}
.tier.rk{--zf:var(--rk);--zc:var(--rk-c);--zd:var(--rk-d);--zs:var(--rk)}
/* Planlar (ana səhifə) */
.bxn{display:flex;align-items:center;gap:6px;padding:8px 6px 8px 16px;border-radius:14px;background:var(--m3);margin-bottom:10px;font-size:13px;font-weight:600}
.bxn>span{flex:1;min-width:0}
.bxn .lk{border:0;background:none;color:var(--m2);font-weight:700;font-size:13px;padding:8px;white-space:nowrap;border-radius:8px}
.bxn .x{width:36px;height:36px;display:grid;place-items:center;padding:0;border-radius:8px}
.htk{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer}
.htk+.htk,.hmo{border-top:1px solid var(--ln)}
.hcb{width:24px;height:24px;border-radius:7px;border:2px solid var(--ckb);background:none;padding:0;display:grid;place-items:center;flex:none}
.hcb svg{width:16px;height:16px;fill:none;stroke:var(--on);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.hcb.on{background:var(--m1);border-color:var(--m1)}.hcb.on svg{opacity:1}
.htk .tx{font-size:16px}.htk.dn .tx{color:var(--mut);text-decoration:line-through}
.hmo{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 0;border-left:0;border-right:0;border-bottom:0;background:none;color:var(--m2);font-weight:700;font-size:14px}
.hmo svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* "Bu həftə" kartı */
.wh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.wh b{font-size:16px;font-weight:700}.wh>span{font-size:13px;color:var(--mut)}
.wr{display:flex;align-items:center;gap:10px;padding:7px 0}.wr.wl{padding:0 0 2px}
.wn2{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wd{display:grid;grid-template-columns:repeat(7,22px);gap:6px;flex:none;justify-items:center;align-items:center}
.wr.wl .wd i{font-style:normal;font-size:11px;font-weight:600;color:var(--mut)}.wr.wl .wd i.td{color:var(--tx);font-weight:700}
.d{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ln2);display:block}
.d.ok{background:var(--a);border-color:var(--a)}
.lim{--a:var(--m1);--fill:var(--m1)}
.d.part{border-color:var(--no)}
.d.no{background:var(--no);border-color:var(--no)}
.d.skip{width:10px;height:2.5px;border:0;border-radius:2px;background:var(--mut)}
.d.off{border:0;background:var(--sf)}
.d.t,.d.pg{border-color:var(--a)}
.d.pg{background:radial-gradient(circle,var(--a) 34%,transparent 38%)}
.ind{display:flex;align-items:center;gap:8px;margin-left:auto}.ind .ck{margin-left:0}

function cremote(ch){let n=0;
 for(const c of ch){const k=c.id;if(c.local||CD.has(k))continue;const d=c.data?c.data.d:null;
  if(d==null){if(!CH.has(k))continue;CH.delete(k);if(k.startsWith('i_')){const id=k.slice(2);S.items=S.items.filter(i=>i.id!=id)}n++;continue}
  if(CH.get(k)===d)continue;CH.set(k,d);let v;try{v=JSON.parse(d)}catch(e){continue}n++;
  if(k.startsWith('i_')){const i=S.items.findIndex(x=>x.id==v.id);if(i<0)S.items.push(v);else S.items[i]=v}
  else if(k=='plans')S.pl=v;else if(k=='mood'){S.md=v.md||{};S.mn=v.mn||{}}
  else if(k=='main'){if(v.bk)S.bk=v.bk;S.bx=v.bx||'';if(v.pv)S.pv=v.pv;if(v.ord)cord(v.ord)}}
 if(n){adopt(S);save();render()}}
